[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-symptom-disease-cascade"
version = "2.0.0"
description = "Leakage-resistant audit of a weather-symptom-disease cascade."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Weather--Symptom--Disease Cascade authors" }]
keywords = [
  "calibration",
  "error-propagation",
  "machine-learning",
  "reproducibility",
  "semantic-bottleneck",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
